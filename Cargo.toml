[package]
name = "k2"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "K2: closed-loop, browser-fidelity load testing engine"
license = "MIT"

[[bin]]
name = "k2"
path = "src/main.rs"

[lib]
name = "k2"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures = "0.3"
bytes = "1"
http = "1"
url = "2"
webpki-roots = "0.26"
wreq = { version = "6.0.0-rc", features = ["ws", "socks", "stream"] }
wreq-util = "3.0.0-rc"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
axum = { version = "0.8", features = ["ws", "tokio"] }
ratatui = "0.29"
crossterm = "0.29"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"], optional = true }

[features]
default = []
backup-ws = ["dep:tokio-tungstenite"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 1
